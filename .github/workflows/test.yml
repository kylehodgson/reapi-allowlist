name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: pip install -e ".[dev]"
    - run: pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: kustomize build
      run: kubectl kustomize deploy > /dev/null
