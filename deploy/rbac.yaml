apiVersion: v1
kind: ServiceAccount
metadata:
  name: reapi-allowlist
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reapi-allowlist
rules:
- apiGroups: ["cilium.io"]
  resources: ["ciliumgatewayclassconfigs"]
  resourceNames: ["reapi-config"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reapi-allowlist
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reapi-allowlist
subjects:
- kind: ServiceAccount
  name: reapi-allowlist
