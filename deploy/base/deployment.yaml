apiVersion: apps/v1
kind: Deployment
metadata:
  name: reapi-allowlist
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      serviceAccountName: reapi-allowlist
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: reapi-allowlist
        image: ghcr.io/kylehodgson/reapi-allowlist:0.1.6
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        args:
        - --emit=cgcc
        - --name=reapi-config
        - --namespace=adsblol
        - --interval=60
        - --window=3600
        - --ingest-dns=ingest-readsb-headless.adsblol.svc.cluster.local
        # Shard IDs are from api.adsb.lol/metrics; the hostnames are inferred.
        # Prefer --mlat-dns if a headless Service fronts these.
        - --mlat-host=mlat-mlat-server-0a
        - --mlat-host=mlat-mlat-server-0b
        - --mlat-host=mlat-mlat-server-0c
        - --mlat-host=mlat-mlat-server-0d
        - --mlat-host=mlat-mlat-server-1a
        - --mlat-host=mlat-mlat-server-2a
        - --mlat-host=mlat-mlat-server-2b
        - --mlat-host=mlat-mlat-server-2c
        ports:
        - containerPort: 9090
          name: metrics
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        readinessProbe:
          httpGet: {path: /metrics, port: metrics}
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: {path: /metrics, port: metrics}
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: reapi-allowlist
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 9090
    targetPort: metrics
